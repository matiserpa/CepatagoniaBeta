<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>CEPATAGONIA — Verificación de certificado</title>
<meta name="description" content="Verificación de autenticidad de los certificados del Congreso de Estética de la Patagonia.">
<link rel="canonical" href="https://cepatagonia.com/certificado.html">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600;700&family=Montserrat:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --cream:#E8E6D4; --sage:#91BBAE; --dark-green:#6B8F71;
    --muted-green:#A1B2A3; --charcoal:#0E1410; --white:#FDFDF9;
    --radius:10px;
    --font-display:'Playfair Display',serif; --font-body:'Montserrat',sans-serif;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  body{font-family:var(--font-body);background:var(--cream);color:var(--charcoal);min-height:100vh;font-size:15px;line-height:1.55}
  header.site{border-bottom:1px solid rgba(14,20,16,.12);padding:26px 20px 20px;text-align:center}
  .horizon{width:120px;height:1px;background:var(--dark-green);margin:0 auto 14px;position:relative}
  .horizon::after{content:'';position:absolute;left:50%;top:-7px;transform:translateX(-50%) rotate(45deg);width:10px;height:10px;border-top:1px solid var(--dark-green);border-left:1px solid var(--dark-green);background:var(--cream)}
  h1{font-family:var(--font-display);font-weight:600;font-size:26px;letter-spacing:.32em;text-indent:.32em}
  header.site p{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--dark-green);margin-top:6px}
  main{max-width:620px;margin:0 auto;padding:36px 16px 80px}
  .panel{background:var(--white);border:1px solid rgba(14,20,16,.08);border-radius:var(--radius);padding:34px 30px;text-align:center}
  .badge{width:64px;height:64px;border-radius:50%;margin:0 auto 18px;display:flex;align-items:center;justify-content:center}
  .badge.ok{background:var(--dark-green)}
  .badge.err{background:#B0654F}
  .badge svg{width:30px;height:30px}
  h2{font-family:var(--font-display);font-weight:600;font-size:23px;margin-bottom:8px}
  .sub{color:rgba(14,20,16,.6);font-size:13.5px;margin-bottom:24px}
  .nombre{font-family:var(--font-display);font-size:27px;font-weight:600;line-height:1.25;margin:4px 0 6px}
  .resumen{text-align:left;background:var(--cream);border-radius:var(--radius);padding:6px 18px;margin:22px 0 0}
  .sum-line{display:flex;justify-content:space-between;gap:14px;padding:11px 0;border-bottom:1px solid rgba(14,20,16,.09);font-size:14px}
  .sum-line:last-child{border:none}
  .sum-line span:first-child{color:rgba(14,20,16,.6)}
  .sum-line b{font-weight:600;text-align:right}
  .nota{font-size:12.5px;color:rgba(14,20,16,.65);background:#f2f6f0;border:1px solid var(--sage);border-radius:var(--radius);padding:13px 16px;text-align:left;margin-top:22px}
  .spinner{width:34px;height:34px;border:3px solid var(--muted-green);border-top-color:var(--dark-green);border-radius:50%;margin:30px auto;animation:spin .9s linear infinite}
  @keyframes spin{to{transform:rotate(360deg)}}
  @media (prefers-reduced-motion: reduce){*{animation:none!important}}
</style>
</head>
<body>
<header class="site">
  <div class="horizon"></div>
  <h1>CEPATAGONIA</h1>
  <p>Ciencia que regenera · Naturaleza que inspira</p>
</header>
<main>
  <section class="panel" id="panel">
    <div class="spinner"></div>
    <p class="sub">Verificando el certificado…</p>
  </section>
</main>

<script>
const API_URL = 'https://script.google.com/macros/s/AKfycbxGP7MPB28EBwcoJVmftDztoraRSUh5Y7ZR1uNjYohbuks-Dwtot2oSEJvglX2ygduMFA/exec';
const params = new URLSearchParams(location.search);
const codigo = params.get('cert') || '';
const panel = document.getElementById('panel');

const TICK = '<svg viewBox="0 0 24 24" fill="none" stroke="#FDFDF9" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"></polyline></svg>';
const CRUZ = '<svg viewBox="0 0 24 24" fill="none" stroke="#FDFDF9" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>';

const esc = (s) => String(s == null ? '' : s).replace(/[&<>"']/g, (c) => (
  { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

const TIPOS = {
  ASISTENCIA: 'Certificado de asistencia',
  DISERTANTE: 'Certificado de disertación',
  POST: 'Certificado de capacitación — Post Congreso',
  STAFF: 'Certificado de participación',
};

function error(titulo, detalle) {
  panel.innerHTML =
    '<div class="badge err">' + CRUZ + '</div>' +
    '<h2>' + esc(titulo) + '</h2>' +
    '<p class="sub">' + esc(detalle) + '</p>' +
    '<div class="nota">Si creés que se trata de un error, escribinos a ' +
    '<b>info@cepatagonia.com</b> indicando el código que figura en el certificado.</div>';
}

function render(d) {
  const TALLERES = { FINCI: 'E. Finci', FERREIRA: 'J. Ferreira' };
  let queCertifica = TIPOS[d.tipo] || d.tipo;
  if (d.tipo === 'POST' && TALLERES[d.jornada]) queCertifica += ' · ' + TALLERES[d.jornada];

  let filas =
    '<div class="sum-line"><span>Certificado</span><b>' + esc(queCertifica) + '</b></div>' +
    '<div class="sum-line"><span>Congreso</span><b>1.ª edición · 10 y 11 de octubre de 2026</b></div>' +
    '<div class="sum-line"><span>Sede</span><b>Hotel Le Village, San Martín de los Andes</b></div>';
  if (d.horas) filas += '<div class="sum-line"><span>Carga horaria</span><b>' + esc(d.horas) + ' horas reloj</b></div>';
  if (d.emitido) filas += '<div class="sum-line"><span>Emitido</span><b>' + esc(d.emitido) + '</b></div>';
  filas += '<div class="sum-line"><span>Código</span><b>' + esc(d.codigo) + '</b></div>';

  panel.innerHTML =
    '<div class="badge ok">' + TICK + '</div>' +
    '<h2>Certificado auténtico</h2>' +
    '<p class="sub">Emitido por CEPATAGONIA a nombre de</p>' +
    '<p class="nombre">' + esc(d.persona) + '</p>' +
    '<div class="resumen">' + filas + '</div>' +
    '<div class="nota">Esta página confirma que el certificado existe y a nombre de quién fue emitido. ' +
    'Por privacidad no muestra el documento ni permite descargarlo: el archivo llegó por correo ' +
    'a quien lo obtuvo.</div>';
}

(async () => {
  if (!codigo) {
    error('Falta el código', 'Escaneá el QR del certificado o abrí el link completo que figura al pie.');
    return;
  }
  try {
    const res = await fetch(API_URL + '?action=certificado&cert=' + encodeURIComponent(codigo));
    const d = await res.json();
    // No alcanza con mirar d.ok: si el backend todavía no conoce esta acción, contesta otra
    // cosa que también trae ok:true, y esta página diría "auténtico" con el nombre vacío.
    // Una verificación que da por bueno todo es peor que no tenerla.
    if (d && d.ok && d.codigo && d.persona) render(d);
    else error('No pudimos verificar este certificado', (d && d.error) || 'El código no corresponde a ningún certificado emitido.');
  } catch (err) {
    error('No pudimos conectarnos', 'Revisá tu conexión y volvé a intentar en un momento.');
  }
})();
</script>
</body>
</html>
