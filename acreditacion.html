<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<meta name="robots" content="noindex, nofollow">
<title>Acreditación — CEPATAGONIA</title>
<meta name="description" content="Acreditación de asistentes por código QR — Congreso de Estética de la Patagonia. Herramienta interna del staff del evento.">
<link rel="canonical" href="https://cepatagonia.com/acreditacion.html">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Montserrat:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --cream:#E8E6D4; --sage:#91BBAE; --dark-green:#6B8F71;
    --muted-green:#A1B2A3; --charcoal:#0E1410; --white:#FDFDF9;
    --rojo:#B0654F; --amarillo:#C9A24B;
    --radius:12px;
    --font-display:'Playfair Display',serif; --font-body:'Montserrat',sans-serif;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  body{font-family:var(--font-body);background:var(--charcoal);color:var(--cream);min-height:100vh;font-size:15px}

  /* ---- login ---- */
  .login{position:fixed;inset:0;background:var(--cream);z-index:100;display:flex;align-items:center;justify-content:center;padding:20px}
  .login-card{max-width:380px;width:100%;background:var(--white);border-radius:var(--radius);padding:34px 28px;text-align:center;color:var(--charcoal)}
  .login-card img{height:80px;margin-bottom:6px}
  .login-card h1{font-family:var(--font-display);font-size:20px;margin-bottom:6px}
  .login-card p{font-size:12.5px;color:rgba(14,20,16,.6);margin-bottom:16px}
  .login-card input{width:100%;padding:12px;border:1px solid rgba(14,20,16,.25);border-radius:8px;font-family:var(--font-body);font-size:15px;text-align:center;letter-spacing:.12em;margin-bottom:10px}
  .login-card .err{display:none;color:var(--rojo);font-size:12px;margin-bottom:8px}
  .btn{width:100%;padding:13px;border:none;border-radius:8px;background:var(--dark-green);color:var(--cream);font-family:var(--font-body);font-size:13px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;cursor:pointer}
  .btn:active{background:var(--charcoal)}

  /* ---- app ---- */
  header{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:12px 14px;background:rgba(232,230,212,.06);border-bottom:1px solid rgba(232,230,212,.15)}
  header .t{font-family:var(--font-display);font-size:16px;letter-spacing:.08em}
  header .cnt{font-size:12px;color:var(--sage)}
  .jornadas{display:flex;gap:8px;padding:12px 14px 4px}
  .jbtn{flex:1;padding:11px 6px;border-radius:9px;border:1.5px solid rgba(232,230,212,.3);background:transparent;color:var(--cream);font-family:var(--font-body);font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;cursor:pointer}
  .jbtn.active{background:var(--dark-green);border-color:var(--dark-green)}

  .scanner{position:relative;margin:12px 14px;border-radius:var(--radius);overflow:hidden;background:#000;aspect-ratio:4/3}
  .scanner video{width:100%;height:100%;object-fit:cover;display:block}
  .marco{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;pointer-events:none}
  .marco div{width:62%;aspect-ratio:1;border:3px solid rgba(232,230,212,.85);border-radius:18px;box-shadow:0 0 0 2000px rgba(0,0,0,.35)}
  .cam-msg{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;text-align:center;padding:20px;font-size:13px;color:rgba(232,230,212,.8)}

  .manual{display:flex;gap:8px;margin:0 14px 12px}
  .manual input{flex:1;padding:12px;border:1px solid rgba(232,230,212,.3);border-radius:9px;background:rgba(232,230,212,.08);color:var(--cream);font-family:var(--font-body);font-size:14px}
  .manual input::placeholder{color:rgba(232,230,212,.45)}
  .manual button{padding:12px 18px;border:none;border-radius:9px;background:var(--dark-green);color:var(--cream);font-weight:700;cursor:pointer;font-family:var(--font-body)}

  .rapido{display:flex;align-items:center;gap:8px;margin:0 14px 14px;font-size:12px;color:rgba(232,230,212,.7)}
  .rapido input{width:16px;height:16px;accent-color:var(--dark-green)}

  /* ---- resultado ---- */
  .result{position:fixed;inset:0;z-index:50;display:none;flex-direction:column;align-items:center;justify-content:center;padding:22px;text-align:center}
  .result.visible{display:flex}
  .result.ok{background:var(--dark-green)}
  .result.warn{background:var(--amarillo);color:var(--charcoal)}
  .result.bad{background:var(--rojo)}
  .result .icono{font-size:64px;line-height:1;margin-bottom:14px}
  .result h2{font-family:var(--font-display);font-size:30px;margin-bottom:6px}
  .result .persona{font-size:22px;font-weight:700;margin:8px 0 2px}
  .result .det{font-size:14.5px;opacity:.92;line-height:1.6;max-width:420px}
  .result .cod{font-family:var(--font-display);letter-spacing:2px;font-size:15px;margin-top:10px;opacity:.85}
  .result .acciones{display:flex;gap:12px;margin-top:26px;width:100%;max-width:420px}
  .result .acciones button{flex:1;padding:16px;border:none;border-radius:10px;font-family:var(--font-body);font-size:14px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;cursor:pointer}
  .b-conf{background:var(--cream);color:var(--charcoal)}
  .b-sec{background:rgba(0,0,0,.25);color:inherit}
</style>
</head>
<body>

<div class="login" id="login">
  <div class="login-card">
    <img src="https://cepatagonia.com/assets/logo-oficial.png" alt="CEPATAGONIA">
    <h1>Acreditación</h1>
    <p>Acceso exclusivo del equipo. Ingresá la clave de acreditador.</p>
    <input id="clave" type="password" placeholder="Clave" autocomplete="off">
    <p class="err" id="loginErr">Clave incorrecta</p>
    <button class="btn" id="loginBtn" type="button">Ingresar</button>
  </div>
</div>

<header>
  <span class="t">CEPATAGONIA · Puerta</span>
  <span class="cnt"><b id="cnt">0</b> acreditados en esta sesión</span>
</header>

<div class="jornadas">
  <button class="jbtn active" data-j="CONGRESO">Congreso<br>10–11 oct</button>
  <button class="jbtn" data-j="FINCI">Post Finci<br>12 oct</button>
  <button class="jbtn" data-j="FERREIRA">Post Ferreira<br>12 oct</button>
</div>

<div class="scanner">
  <video id="video" playsinline muted></video>
  <div class="marco"><div></div></div>
  <div class="cam-msg" id="camMsg">Iniciando cámara…</div>
</div>

<div class="manual">
  <input id="manual" placeholder="Código manual o lector USB (CEP-XXXX-P1)" autocomplete="off">
  <button type="button" id="manualBtn">Buscar</button>
</div>

<label class="rapido"><input type="checkbox" id="rapido"> Acreditación directa (confirma sola al escanear)</label>

<div class="result" id="result">
  <div class="icono" id="rIcono"></div>
  <h2 id="rTitulo"></h2>
  <p class="persona" id="rPersona"></p>
  <p class="det" id="rDet"></p>
  <p class="cod" id="rCod"></p>
  <div class="acciones">
    <button class="b-sec" type="button" id="rCancelar">Volver</button>
    <button class="b-conf" type="button" id="rConfirmar" style="display:none">Confirmar ingreso</button>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/jsQR/1.4.0/jsQR.min.js"></script>
<script>
const API_URL = 'https://script.google.com/macros/s/AKfycbxGP7MPB28EBwcoJVmftDztoraRSUh5Y7ZR1uNjYohbuks-Dwtot2oSEJvglX2ygduMFA/exec';

let CLAVE = '';
let jornada = 'CONGRESO';
let ocupado = false;
let ultimo = { c: '', t: 0 };
let pendiente = null;
let contador = 0;

// ---------- sonido ----------
function beep(freq, ms){
  try{
    const ctx = beep.ctx || (beep.ctx = new (window.AudioContext || window.webkitAudioContext)());
    const o = ctx.createOscillator(), g = ctx.createGain();
    o.frequency.value = freq; o.connect(g); g.connect(ctx.destination);
    g.gain.setValueAtTime(.25, ctx.currentTime);
    o.start(); o.stop(ctx.currentTime + ms/1000);
  }catch(e){}
}

// ---------- login ----------
async function probarClave(k){
  const res = await fetch(API_URL, { method:'POST',
    headers:{ 'Content-Type':'text/plain;charset=utf-8' },
    body: JSON.stringify({ action:'verificarAcceso', clave:k, codigo:'PING', jornada:'CONGRESO' }) });
  const data = await res.json();
  return !(data.motivo && data.motivo.indexOf('Clave') === 0);
}
document.getElementById('loginBtn').onclick = async function(){
  const k = document.getElementById('clave').value.trim();
  if(!k) return;
  this.textContent = 'Verificando…';
  const ok = await probarClave(k).catch(()=>false);
  this.textContent = 'Ingresar';
  if(ok){
    CLAVE = k;
    try{ sessionStorage.setItem('cepaAcred', k); }catch(e){}
    document.getElementById('login').remove();
    iniciarCamara();
    document.getElementById('manual').focus();
  } else {
    document.getElementById('loginErr').style.display = 'block';
  }
};
document.getElementById('clave').addEventListener('keydown', e=>{ if(e.key==='Enter') document.getElementById('loginBtn').click(); });
(function(){
  try{
    const k = sessionStorage.getItem('cepaAcred');
    if(k){ CLAVE = k; document.getElementById('login').remove(); iniciarCamara(); }
  }catch(e){}
})();

// ---------- jornadas ----------
document.querySelectorAll('.jbtn').forEach(b=>{
  b.onclick = ()=>{
    jornada = b.dataset.j;
    document.querySelectorAll('.jbtn').forEach(x=>x.classList.toggle('active', x===b));
  };
});

// ---------- API ----------
async function llamar(action, codigo){
  const res = await fetch(API_URL, { method:'POST',
    headers:{ 'Content-Type':'text/plain;charset=utf-8' },
    body: JSON.stringify({ action:action, clave:CLAVE, codigo:codigo, jornada:jornada }) });
  return res.json();
}

// ---------- resultado ----------
function jorNombre(){ return jornada==='CONGRESO' ? 'Congreso 10–11' : (jornada==='FINCI' ? 'Post E. Finci' : 'Post J. Ferreira'); }
function mostrar(tipo, titulo, persona, det, cod, conConfirmar){
  const r = document.getElementById('result');
  r.className = 'result visible ' + tipo;
  document.getElementById('rIcono').textContent = tipo==='ok' ? '✓' : (tipo==='warn' ? '⚠' : '✕');
  document.getElementById('rTitulo').textContent = titulo;
  document.getElementById('rPersona').textContent = persona || '';
  document.getElementById('rDet').innerHTML = det || '';
  document.getElementById('rCod').textContent = cod || '';
  document.getElementById('rConfirmar').style.display = conConfirmar ? 'block' : 'none';
}
function cerrar(){
  document.getElementById('result').className = 'result';
  pendiente = null; ocupado = false;
  const m = document.getElementById('manual'); m.value=''; m.focus();
}
document.getElementById('rCancelar').onclick = cerrar;
document.getElementById('rConfirmar').onclick = async function(){
  if(!pendiente) return cerrar();
  this.textContent = 'Confirmando…';
  const data = await llamar('acreditar', pendiente).catch(()=>({ok:false,motivo:'Error de conexión'}));
  this.textContent = 'Confirmar ingreso';
  if(data.ok){ registrarOK(data); } else { resultadoNegativo(data); }
};

function registrarOK(data){
  contador++; document.getElementById('cnt').textContent = contador;
  beep(880,120); setTimeout(()=>beep(1320,150),130);
  mostrar('ok','Ingreso registrado', data.persona,
    'Asientos: <b>'+data.asientos+'</b> · Persona '+data.personaNum+' de '+data.totalPersonas+'<br>'+jorNombre(),
    data.codigo, false);
  setTimeout(cerrar, 2200);
}
function resultadoNegativo(data){
  beep(220,350);
  if(data.motivo === 'YA INGRESÓ' && data.detalle){
    const d = data.detalle;
    mostrar('warn','Ya ingresó', d.persona,
      'Este código ya fue acreditado en '+jorNombre()+'<br>Primer ingreso: <b>'+new Date(d.yaIngreso).toLocaleTimeString('es-AR')+'</b>',
      d.codigo, false);
  } else {
    mostrar('bad','No válido','', data.motivo || 'Error', '', false);
  }
}

// ---------- procesar código ----------
async function procesar(codigo){
  codigo = String(codigo||'').trim();
  if(!codigo || ocupado) return;
  const ahora = Date.now();
  if(codigo === ultimo.c && ahora - ultimo.t < 3000) return; // anti doble lectura
  ultimo = { c: codigo, t: ahora };
  ocupado = true;
  beep(660,80);

  const directo = document.getElementById('rapido').checked;
  const data = await llamar(directo ? 'acreditar' : 'verificarAcceso', codigo)
    .catch(()=>({ok:false,motivo:'Error de conexión'}));

  if(directo){
    if(data.ok){ registrarOK(data); } else { resultadoNegativo(data); }
    return;
  }
  if(!data.ok){ resultadoNegativo(data); return; }
  if(data.yaIngreso){
    resultadoNegativo({ motivo:'YA INGRESÓ', detalle:data });
    return;
  }
  pendiente = codigo;
  mostrar('ok','Entrada válida', data.persona,
    'Asientos: <b>'+data.asientos+'</b> · Persona '+data.personaNum+' de '+data.totalPersonas+
    (data.post && data.post!=='NO' ? '<br>Incluye: '+data.post : '')+'<br>'+jorNombre(),
    data.codigo, true);
}

// ---------- entrada manual / lector USB ----------
document.getElementById('manualBtn').onclick = ()=>procesar(document.getElementById('manual').value);
document.getElementById('manual').addEventListener('keydown', e=>{
  if(e.key === 'Enter'){ e.preventDefault(); procesar(e.target.value); }
});

// ---------- cámara ----------
let detector = null, canvas = null, cctx = null;
async function iniciarCamara(){
  const video = document.getElementById('video');
  const msg = document.getElementById('camMsg');
  try{
    const stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'environment' }, audio: false });
    video.srcObject = stream;
    await video.play();
    msg.style.display = 'none';
    if('BarcodeDetector' in window){
      try{ detector = new BarcodeDetector({ formats: ['qr_code'] }); }catch(e){ detector = null; }
    }
    if(!detector){ canvas = document.createElement('canvas'); cctx = canvas.getContext('2d', { willReadFrequently: true }); }
    escanear(video);
  }catch(err){
    msg.textContent = 'No se pudo acceder a la cámara. Usá el campo manual o el lector USB.';
  }
}
async function escanear(video){
  if(!document.getElementById('result').classList.contains('visible') && video.readyState === 4 && !ocupado){
    try{
      if(detector){
        const codes = await detector.detect(video);
        if(codes.length) procesar(codes[0].rawValue);
      } else if(window.jsQR){
        canvas.width = video.videoWidth; canvas.height = video.videoHeight;
        cctx.drawImage(video, 0, 0);
        const img = cctx.getImageData(0, 0, canvas.width, canvas.height);
        const code = jsQR(img.data, img.width, img.height);
        if(code && code.data) procesar(code.data);
      }
    }catch(e){}
  }
  setTimeout(()=>escanear(video), 280);
}
</script>
</body>
</html>
