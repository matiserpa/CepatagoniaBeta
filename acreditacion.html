<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<meta name="robots" content="noindex, nofollow">
<title>Acreditación — CEPATAGONIA</title>
<meta name="description" content="Acreditación de asistentes por código QR — Congreso de Estética de la Patagonia. Herramienta interna del staff del evento.">
<link rel="canonical" href="https://cepatagonia.com/acreditacion.html">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Montserrat:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#efede6; --bg-marco:#e2ded0; --panel:#ffffff; --panel-strong:#e7e4db;
    --text:#181713; --muted:#64675f; --muted-2:#80857c; --line:rgba(35,36,32,.14);
    --a1:#7f977f; --a2:#9bb3a3; --a3:#bccdbd; --a4:#dedcd2;
    --dark:#0e1410; --danger:#b23b3b; --ok:#4a7a52; --amarillo:#c9a24b;
    --radius:14px;
    --font-display:'Playfair Display',serif; --font-body:'Montserrat',sans-serif;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{height:100%}
  body{
    font-family:var(--font-body);font-weight:500;font-size:15.5px;
    background:var(--bg-marco);color:var(--text);
    -webkit-font-smoothing:antialiased;
  }
  h1,h2{font-family:var(--font-display);color:var(--text)}

  /* columna tipo "app" — en desktop queda centrada, angosta como un celular */
  .app{max-width:460px;margin:0 auto;min-height:100vh;background:var(--bg);box-shadow:0 0 50px rgba(20,18,12,.1)}

  /* ---- login ---- */
  .login{position:fixed;inset:0;background:var(--bg-marco);z-index:100;display:flex;align-items:center;justify-content:center;padding:20px}
  .login-card{max-width:380px;width:100%;background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);box-shadow:0 12px 32px rgba(48,45,37,.12);padding:34px 28px;text-align:center;color:var(--text)}
  .login-card img{height:100px;margin-bottom:14px}
  .login-card h1{font-size:20px;margin-bottom:6px}
  .login-card p{font-size:13px;color:var(--muted);margin-bottom:20px}
  .login-card .err{display:none;color:var(--danger);font-weight:700;font-size:12.5px;margin:4px 0 8px}
  .login-card .gwrap{display:flex;justify-content:center;margin-bottom:4px;min-height:44px}

  /* ---- header ---- */
  header{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:10px;padding:10px 16px;background:var(--panel);border-bottom:1px solid var(--line)}
  header .etiqueta{font-family:var(--font-display);font-size:14px;color:var(--text);justify-self:start}
  header .logo{height:52px;width:auto;display:block;justify-self:center}
  header .cnt{font-size:11.5px;font-weight:700;color:var(--a1);text-align:right;white-space:nowrap;justify-self:end}

  .jornadas{display:flex;gap:8px;padding:12px 14px 4px}
  .jbtn{flex:1;padding:10px 6px;border-radius:999px;border:1px solid var(--line);background:var(--panel);color:var(--text);font-family:var(--font-body);font-size:10.5px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;cursor:pointer;line-height:1.5}
  .jbtn.active{background:var(--a1);border-color:var(--a1);color:#fdfdf9}

  .scanner{position:relative;margin:12px 14px;border-radius:var(--radius);overflow:hidden;background:var(--dark);aspect-ratio:4/3;border:1px solid var(--line)}
  .scanner video{width:100%;height:100%;object-fit:cover;display:block}
  .marco{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;pointer-events:none}
  .marco div{width:62%;aspect-ratio:1;border:3px solid rgba(253,253,249,.85);border-radius:18px;box-shadow:0 0 0 2000px rgba(0,0,0,.35)}
  .cam-msg{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;text-align:center;padding:20px;font-size:13px;color:rgba(253,253,249,.8)}

  .manual{display:flex;gap:8px;margin:0 14px 12px}
  .manual input{flex:1;min-width:0;padding:12px;border:1px solid var(--line);border-radius:10px;background:var(--panel);color:var(--text);font-family:var(--font-body);font-weight:500;font-size:16px}
  .manual input::placeholder{color:var(--muted-2);font-size:13px}
  .manual button{padding:12px 16px;border:none;border-radius:10px;background:var(--a1);color:#fdfdf9;font-weight:700;cursor:pointer;font-family:var(--font-body);white-space:nowrap}

  .rapido{display:flex;align-items:center;gap:8px;margin:0 14px 16px;font-size:12px;color:var(--muted)}
  .rapido input{width:16px;height:16px;accent-color:var(--a1)}
  #busqResultados{margin:0 14px 12px;display:flex;flex-direction:column;gap:6px}
  .busq-msg{font-size:13px;color:var(--muted-2);padding:4px 2px}
  .busq-item{text-align:left;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--panel);color:var(--text);font-family:var(--font-body);font-size:14px;cursor:pointer}
  .busq-item small{color:var(--muted-2);font-size:12px}
  .busq-ya{font-size:11px;font-weight:700;color:#a4553f;border:1px solid #a4553f;border-radius:999px;padding:1px 8px;margin-left:6px}

  /* ---- resultado ---- */
  .result{position:fixed;inset:0;z-index:50;display:none;flex-direction:column;align-items:center;justify-content:center;padding:22px;text-align:center}
  .result.visible{display:flex}
  .result.ok{background:var(--ok);color:#fdfdf9}
  .result.warn{background:var(--amarillo);color:var(--dark)}
  .result.bad{background:var(--danger);color:#fdfdf9}
  .result .icono{font-size:64px;line-height:1;margin-bottom:14px}
  .result h2{font-size:30px;margin-bottom:6px}
  .result .persona{font-size:22px;font-weight:700;margin:8px 0 2px}
  .result .det{font-size:14.5px;opacity:.92;line-height:1.6;max-width:380px}
  .result .cod{font-family:var(--font-display);letter-spacing:2px;font-size:15px;margin-top:10px;opacity:.85}
  .result .acciones{display:flex;gap:12px;margin-top:26px;width:100%;max-width:380px}
  .result .acciones button{flex:1;padding:16px;border:none;border-radius:10px;font-family:var(--font-body);font-size:14px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;cursor:pointer}
  .b-conf{background:#fdfdf9;color:var(--dark)}
  .b-sec{background:rgba(0,0,0,.22);color:inherit}

  /* ---- pantallas angostas ---- */
  @media (max-width:400px){
    header{padding:8px 12px}
    header .etiqueta{font-size:12px}
    header .logo{height:40px}
    header .cnt{font-size:10.5px}
    .jornadas{padding:10px 10px 4px;gap:6px}
    .jbtn{font-size:9.5px;padding:10px 4px}
    .scanner{margin:10px}
    .manual{margin:0 10px 10px;gap:6px}
    .manual button{padding:12px 14px;font-size:13px}
    .rapido{margin:0 10px 12px;font-size:11.5px}
    .result h2{font-size:24px}
    .result .persona{font-size:19px}
    .result .det{font-size:13.5px}
  }
</style>
</head>
<body>

<div class="login" id="login">
  <div class="login-card">
    <img src="https://cepatagonia.com/assets/logo-oficial.png" alt="CEPATAGONIA">
    <h1>Acreditación</h1>
    <p>Acceso exclusivo del equipo. Ingresá con tu cuenta de Google autorizada.</p>
    <div class="gwrap" id="gBtn"></div>
    <p class="err" id="loginErr"></p>
  </div>
</div>

<div class="app">
  <header>
    <span class="etiqueta">Puerta</span>
    <img class="logo" src="https://cepatagonia.com/assets/logo_oficial.png" alt="CEPATAGONIA">
    <span class="cnt"><b id="cnt">0</b> acreditados<br>en esta sesión</span>
  </header>

  <div class="jornadas">
    <button class="jbtn active" data-j="CONGRESO">Congreso<br>10–11 oct</button>
    <button class="jbtn" data-j="FINCI">Post Finci<br>12 oct</button>
    <button class="jbtn" data-j="FERREIRA">Post Ferreira<br>12 oct</button>
  </div>

  <div class="scanner">
    <video id="video" playsinline muted></video>
    <div class="marco"><div></div></div>
    <div class="cam-msg" id="camMsg">Iniciando cámara…</div>
  </div>

  <div class="manual">
    <input id="manual" placeholder="Código manual o lector USB (CEP-XXXX-P1)" autocomplete="off">
    <button type="button" id="manualBtn">Buscar</button>
  </div>

  <div class="manual" style="margin-top:-4px">
    <input id="busqueda" placeholder="¿Sin QR? Buscar por nombre o DNI" autocomplete="off">
    <button type="button" id="busquedaBtn">Buscar</button>
  </div>
  <div id="busqResultados" style="display:none"></div>

  <label class="rapido"><input type="checkbox" id="rapido"> Acreditación directa (confirma sola al escanear)</label>
</div>

<div class="result" id="result">
  <div class="icono" id="rIcono"></div>
  <h2 id="rTitulo"></h2>
  <p class="persona" id="rPersona"></p>
  <p class="det" id="rDet"></p>
  <p class="cod" id="rCod"></p>
  <div class="acciones">
    <button class="b-sec" type="button" id="rCancelar">Volver</button>
    <button class="b-sec" type="button" id="rDeshacer" style="display:none">Deshacer ingreso</button>
    <button class="b-conf" type="button" id="rConfirmar" style="display:none">Confirmar ingreso</button>
  </div>
</div>

<script src="https://accounts.google.com/gsi/client"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jsQR/1.4.0/jsQR.min.js"></script>
<script>
const API_URL = 'https://script.google.com/macros/s/AKfycbxGP7MPB28EBwcoJVmftDztoraRSUh5Y7ZR1uNjYohbuks-Dwtot2oSEJvglX2ygduMFA/exec';
const GOOGLE_CLIENT_ID = '772242856871-a78k98qpso708f7vgetmu4u7011mvhas.apps.googleusercontent.com';
const TOKEN_KEY = 'cepaAcredToken';

let ID_TOKEN = '';
let jornada = 'CONGRESO';
let ocupado = false;
let ultimo = { c: '', t: 0 };
let pendiente = null;
let contador = 0;
let cerrarTimer = null;
let deshacerCod = null;

// ---------- sonido ----------
function beep(freq, ms){
  try{
    const ctx = beep.ctx || (beep.ctx = new (window.AudioContext || window.webkitAudioContext)());
    const o = ctx.createOscillator(), g = ctx.createGain();
    o.frequency.value = freq; o.connect(g); g.connect(ctx.destination);
    g.gain.setValueAtTime(.25, ctx.currentTime);
    o.start(); o.stop(ctx.currentTime + ms/1000);
  }catch(e){}
}

// ---------- login (Google) ----------
async function probarToken(token){
  const res = await fetch(API_URL, { method:'POST',
    headers:{ 'Content-Type':'text/plain;charset=utf-8' },
    body: JSON.stringify({ action:'panelAuth', id_token:token }) });
  return res.json(); // { ok, email, nombre, rol } o { ok:false, error }
}
function entrarConToken(token){
  ID_TOKEN = token;
  try{ sessionStorage.setItem(TOKEN_KEY, token); }catch(e){}
  document.getElementById('login').remove();
  iniciarCamara();
}
async function handleCredentialResponse(resp){
  const err = document.getElementById('loginErr');
  err.style.display = 'none';
  const data = await probarToken(resp.credential).catch(()=>({ ok:false, error:'Error de conexión' }));
  if(data.ok && (data.rol === 'admin' || data.rol === 'acreditador')){
    entrarConToken(resp.credential);
  } else {
    err.textContent = data.error || 'Tu cuenta no tiene acceso autorizado';
    err.style.display = 'block';
  }
}
(function(){
  google.accounts.id.initialize({ client_id: GOOGLE_CLIENT_ID, callback: handleCredentialResponse });
  google.accounts.id.renderButton(document.getElementById('gBtn'), { theme:'filled_black', size:'large', text:'signin_with', shape:'pill', width:260 });
  try{
    const t = sessionStorage.getItem(TOKEN_KEY);
    if(t){
      probarToken(t).then(data=>{
        if(data.ok && (data.rol==='admin' || data.rol==='acreditador')) entrarConToken(t);
        else sessionStorage.removeItem(TOKEN_KEY);
      }).catch(()=>{});
    }
  }catch(e){}
})();

// ---------- foco permanente en el campo manual (así el lector USB, que "escribe" como
// un teclado, siempre cae ahí sin que el staff tenga que tocar el campo antes de escanear) ----------
function enfocarManual(){
  const m = document.getElementById('manual');
  if (m && document.activeElement !== m) m.focus();
}
setInterval(()=>{
  // No robar el foco si el staff está tipeando en la búsqueda por nombre
  const a = document.activeElement;
  if(a && a.id === 'busqueda') return;
  if(!document.getElementById('login') && !document.getElementById('result').classList.contains('visible')) enfocarManual();
}, 1000);

// ---------- jornadas ----------
document.querySelectorAll('.jbtn').forEach(b=>{
  b.onclick = ()=>{
    jornada = b.dataset.j;
    document.querySelectorAll('.jbtn').forEach(x=>x.classList.toggle('active', x===b));
    enfocarManual();
  };
});
document.getElementById('rapido').addEventListener('change', enfocarManual);

// ---------- API ----------
async function llamar(action, codigo){
  const res = await fetch(API_URL, { method:'POST',
    headers:{ 'Content-Type':'text/plain;charset=utf-8' },
    body: JSON.stringify({ action:action, id_token:ID_TOKEN, codigo:codigo, jornada:jornada }) });
  return res.json();
}

// ---------- resultado ----------
function jorNombre(){ return jornada==='CONGRESO' ? 'Congreso 10–11' : (jornada==='FINCI' ? 'Post E. Finci' : 'Post J. Ferreira'); }
// Cartel destacado cuando la orden es una RESERVA sin pagar (abona en la puerta)
function avisoAbonar(d){
  if (!d || !d.faltaAbonar) return '';
  var saldo = Number(d.saldo);
  var texto = (saldo > 0)
    ? '⚠ FALTA ABONAR $' + saldo.toLocaleString('es-AR') + ' — cobrar en la puerta'
    : '⚠ FALTA ABONAR — cobrar en la puerta';
  return '<br><b style="display:inline-block;margin-top:10px;padding:5px 14px;border-radius:999px;background:#fdfdf9;color:var(--danger);font-size:15.5px;letter-spacing:.03em">' + texto + '</b>';
}
function mostrar(tipo, titulo, persona, det, cod, conConfirmar){
  const r = document.getElementById('result');
  r.className = 'result visible ' + tipo;
  document.getElementById('rIcono').textContent = tipo==='ok' ? '✓' : (tipo==='warn' ? '⚠' : '✕');
  document.getElementById('rTitulo').textContent = titulo;
  document.getElementById('rPersona').textContent = persona || '';
  document.getElementById('rDet').innerHTML = det || '';
  document.getElementById('rCod').textContent = cod || '';
  document.getElementById('rConfirmar').style.display = conConfirmar ? 'block' : 'none';
  document.getElementById('rDeshacer').style.display = 'none';
}
function cerrar(){
  clearTimeout(cerrarTimer);
  document.getElementById('result').className = 'result';
  pendiente = null; ocupado = false; deshacerCod = null;
  const m = document.getElementById('manual'); m.value=''; m.focus();
}
document.getElementById('rCancelar').onclick = cerrar;
document.getElementById('rConfirmar').onclick = async function(){
  if(!pendiente) return cerrar();
  this.textContent = 'Confirmando…';
  const data = await llamar('acreditar', pendiente).catch(()=>({ok:false,motivo:'Error de conexión'}));
  this.textContent = 'Confirmar ingreso';
  if(data.ok){ registrarOK(data); } else { resultadoNegativo(data); }
};
document.getElementById('rDeshacer').onclick = async function(){
  if(!deshacerCod) return cerrar();
  clearTimeout(cerrarTimer);
  const cod = deshacerCod.codigo, conto = deshacerCod.conto;
  this.textContent = 'Deshaciendo…';
  const data = await llamar('desacreditar', cod).catch(()=>({ok:false,motivo:'Error de conexión'}));
  this.textContent = 'Deshacer ingreso';
  if(data.ok){
    if(conto && contador>0){ contador--; document.getElementById('cnt').textContent = contador; }
    beep(440,200);
    mostrar('warn','Ingreso deshecho', data.persona||'', 'Se quitó el ingreso. Ya podés escanear de nuevo.', cod, false);
    setTimeout(cerrar, 1800);
  } else {
    mostrar('bad','No se pudo deshacer','', data.motivo || 'Error', '', false);
  }
};

function registrarOK(data){
  contador++; document.getElementById('cnt').textContent = contador;
  beep(880,120); setTimeout(()=>beep(1320,150),130);
  mostrar('ok','Ingreso registrado', data.persona,
    'Asientos: <b>'+data.asientos+'</b> · Persona '+data.personaNum+' de '+data.totalPersonas+'<br>'+jorNombre()+avisoAbonar(data),
    data.codigo, false);
  deshacerCod = { codigo: data.codigo, conto: true };
  document.getElementById('rDeshacer').style.display = 'block';
  clearTimeout(cerrarTimer);
  cerrarTimer = setTimeout(cerrar, 4500);
}
function resultadoNegativo(data){
  beep(220,350);
  if(data.motivo === 'YA INGRESÓ' && data.detalle){
    const d = data.detalle;
    mostrar('warn','Ya ingresó', d.persona,
      'Este código ya fue acreditado en '+jorNombre()+'<br>Primer ingreso: <b>'+new Date(d.yaIngreso).toLocaleTimeString('es-AR')+'</b>'+avisoAbonar(d),
      d.codigo, false);
    deshacerCod = { codigo: d.codigo, conto: false };
    document.getElementById('rDeshacer').style.display = 'block';
  } else {
    mostrar('bad','No válido','', data.motivo || 'Error', '', false);
  }
}

// ---------- procesar código ----------
async function procesar(codigo){
  codigo = String(codigo||'').trim();
  if(!codigo || ocupado) return;
  const ahora = Date.now();
  if(codigo === ultimo.c && ahora - ultimo.t < 3000) return; // anti doble lectura
  ultimo = { c: codigo, t: ahora };
  ocupado = true;
  beep(660,80);

  const directo = document.getElementById('rapido').checked;
  const data = await llamar(directo ? 'acreditar' : 'verificarAcceso', codigo)
    .catch(()=>({ok:false,motivo:'Error de conexión'}));

  if(directo){
    if(data.ok){ registrarOK(data); } else { resultadoNegativo(data); }
    return;
  }
  if(!data.ok){ resultadoNegativo(data); return; }
  if(data.yaIngreso){
    resultadoNegativo({ motivo:'YA INGRESÓ', detalle:data });
    return;
  }
  pendiente = codigo;
  mostrar('ok','Entrada válida', data.persona,
    'Asientos: <b>'+data.asientos+'</b> · Persona '+data.personaNum+' de '+data.totalPersonas+
    (data.post && data.post!=='NO' ? '<br>Incluye: '+data.post : '')+'<br>'+jorNombre()+avisoAbonar(data),
    data.codigo, true);
}

// ---------- entrada manual / lector USB ----------
document.getElementById('manualBtn').onclick = ()=>procesar(document.getElementById('manual').value);
document.getElementById('manual').addEventListener('keydown', e=>{
  if(e.key === 'Enter'){ e.preventDefault(); procesar(e.target.value); }
});

// ---------- búsqueda por nombre / DNI (para gente sin el QR a mano) ----------
function escHtml(s){ return String(s||'').replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function limpiarBusqueda(){
  document.getElementById('busqueda').value = '';
  const c = document.getElementById('busqResultados');
  c.style.display = 'none'; c.innerHTML = '';
}
async function buscarPorNombre(){
  const q = document.getElementById('busqueda').value.trim();
  const cont = document.getElementById('busqResultados');
  cont.style.display = 'flex';
  if(q.length < 3){ cont.innerHTML = '<div class="busq-msg">Escribí al menos 3 letras o números.</div>'; return; }
  cont.innerHTML = '<div class="busq-msg">Buscando…</div>';
  const res = await fetch(API_URL, { method:'POST', headers:{ 'Content-Type':'text/plain;charset=utf-8' },
    body: JSON.stringify({ action:'buscarPersonaAcceso', id_token:ID_TOKEN, consulta:q, jornada:jornada }) })
    .then(r=>r.json()).catch(()=>({ ok:false, error:'Error de conexión' }));
  if(!res.ok){ cont.innerHTML = '<div class="busq-msg">'+escHtml(res.error||'No se pudo buscar')+'</div>'; return; }
  if(!res.resultados.length){ cont.innerHTML = '<div class="busq-msg">Sin resultados para “'+escHtml(q)+'” en '+jorNombre()+'.</div>'; return; }
  cont.innerHTML = res.resultados.map(r =>
    '<button type="button" class="busq-item" data-cod="'+escHtml(r.codigo)+'">'+
    '<b>'+escHtml(r.persona)+'</b>'+(r.yaIngreso ? '<span class="busq-ya">ya entró '+escHtml(r.yaIngreso)+'</span>' : '')+
    '<br><small>'+escHtml(r.codigo)+(r.asientos ? ' · asientos '+escHtml(r.asientos) : '')+'</small></button>'
  ).join('');
  cont.querySelectorAll('.busq-item').forEach(b=>{
    b.onclick = ()=>{ limpiarBusqueda(); procesar(b.dataset.cod); };
  });
}
document.getElementById('busquedaBtn').onclick = buscarPorNombre;
document.getElementById('busqueda').addEventListener('keydown', e=>{
  if(e.key === 'Enter'){ e.preventDefault(); buscarPorNombre(); }
});
document.querySelectorAll('.jbtn').forEach(b=> b.addEventListener('click', limpiarBusqueda));

// ---------- cámara ----------
let detector = null, canvas = null, cctx = null;
async function iniciarCamara(){
  const video = document.getElementById('video');
  const msg = document.getElementById('camMsg');
  try{
    const stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'environment' }, audio: false });
    video.srcObject = stream;
    await video.play();
    msg.style.display = 'none';
    if('BarcodeDetector' in window){
      try{ detector = new BarcodeDetector({ formats: ['qr_code'] }); }catch(e){ detector = null; }
    }
    if(!detector){ canvas = document.createElement('canvas'); cctx = canvas.getContext('2d', { willReadFrequently: true }); }
    escanear(video);
  }catch(err){
    msg.textContent = 'No se pudo acceder a la cámara. Usá el campo manual o el lector USB.';
  }
  enfocarManual();
}
async function escanear(video){
  if(!document.getElementById('result').classList.contains('visible') && video.readyState === 4 && !ocupado){
    try{
      if(detector){
        const codes = await detector.detect(video);
        if(codes.length) procesar(codes[0].rawValue);
      } else if(window.jsQR){
        canvas.width = video.videoWidth; canvas.height = video.videoHeight;
        cctx.drawImage(video, 0, 0);
