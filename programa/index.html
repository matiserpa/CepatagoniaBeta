<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Programa · CEPATAGONIA</title>
<meta name="theme-color" content="#1F3326">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<!--
  DESTINO DEL QR DE LOS ROLL-UPS. Esta URL (https://cepatagonia.com/programa/) está impresa:
  no se mueve ni se renombra nunca.

  Para activar el programa se cambia UNA línea: PROGRAMA_URL, al principio del script.
-->
<script async src="https://www.googletagmanager.com/gtag/js?id=G-K96KWN1371"></script>
<script>
  window.dataLayer = window.dataLayer || [];
  function gtag(){ dataLayer.push(arguments); }
  gtag('js', new Date());
  gtag('config', 'G-K96KWN1371');
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;700&family=Montserrat:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --fondo:#1F3326; --texto:#E8E6D4;
    --acento1:#91BBAE; --acento2:#A1B2A3; --acento3:#6B8F71;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{background:var(--fondo)}
  body{
    min-height:100vh; min-height:100dvh;
    color:var(--texto); font-family:'Montserrat',system-ui,-apple-system,sans-serif;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    padding:calc(32px + env(safe-area-inset-top)) 22px calc(32px + env(safe-area-inset-bottom));
    text-align:center;
  }
  main{width:100%; max-width:440px}
  .logo{display:block; width:62%; max-width:230px; height:auto; margin:0 auto 34px}
  h1{
    font-family:'Playfair Display',Georgia,serif; font-weight:700;
    font-size:clamp(34px,11vw,46px); letter-spacing:.22em; margin-right:-.22em; line-height:1.1;
  }
  .bajada{
    margin:16px auto 0; max-width:340px;
    font-size:13px; line-height:1.75; letter-spacing:.04em; color:var(--acento2);
  }
  .bajada b{display:block; font-weight:500; color:var(--texto); letter-spacing:.06em}
  .separador{display:flex; align-items:center; justify-content:center; gap:12px; margin:34px auto}
  .separador span{display:block; width:46px; height:1px; background:var(--acento3)}
  .separador i{display:block; width:6px; height:6px; border-radius:50%; background:var(--acento1)}

  .pronto{
    font-family:'Playfair Display',Georgia,serif; font-weight:500;
    font-size:clamp(20px,6vw,24px); line-height:1.45; color:var(--texto);
  }
  .pronto small{
    display:block; margin-top:14px;
    font-family:'Montserrat',system-ui,sans-serif; font-size:14px; font-weight:400;
    line-height:1.6; letter-spacing:.02em; color:var(--acento1);
  }

  .ver{
    display:none; width:100%; padding:19px 24px; border-radius:999px;
    background:var(--acento1); color:var(--fondo); text-decoration:none;
    font-weight:700; font-size:16px; letter-spacing:.2em;
    box-shadow:0 10px 30px rgba(0,0,0,.25);
  }
  .ver:active{transform:scale(.98)}
  .abriendo{display:none; margin-top:16px; font-size:12.5px; color:var(--acento2); letter-spacing:.03em}
  .activo .ver{display:block}
  .activo .abriendo{display:block}
  .activo .pronto{display:none}
</style>
</head>
<body>
<main id="contenido">
  <img class="logo" src="/programa/logo-cepatagonia-claro.png" alt="CEPATAGONIA" width="480" height="303">
  <h1>PROGRAMA</h1>
  <p class="bajada"><b>Primer Congreso de Estética de la Patagonia</b>10 y 11 de octubre de 2026 · San Martín de los Andes</p>

  <div class="separador" aria-hidden="true"><span></span><i></i><span></span></div>

  <p class="pronto">El programa completo se publica muy pronto.<small>Volvé a escanear el QR en unos días.</small></p>
  <a class="ver" id="ver" href="#">VER PROGRAMA</a>
  <p class="abriendo">Abriendo el programa…</p>
</main>

<script>
// ===================== CONFIGURACIÓN =====================
// Vacía: se muestra "el programa se publica muy pronto".
// Con una URL ('/programa/programa.pdf' o un link de Google Drive): aparece el botón
// VER PROGRAMA y se redirige solo después de registrar la visita.
const PROGRAMA_URL = '/programa/programa.pdf';

// Apps Script que anota cada escaneo en una Google Sheet. Vacía: no se usa.
const CONTADOR_URL = '';
// =========================================================

(function () {
  // De dónde viene el escaneo: los roll-ups llevan ?qr=rollup. Se limpia para que nadie
  // meta cualquier cosa en las estadísticas.
  var origen = 'directo';
  try {
    var q = new URLSearchParams(window.location.search).get('qr');
    if (q) origen = String(q).toLowerCase().replace(/[^a-z0-9_-]/g, '').slice(0, 40) || 'directo';
  } catch (e) {}

  var hayPrograma = typeof PROGRAMA_URL === 'string' && PROGRAMA_URL.trim() !== '';
  var destino = hayPrograma ? PROGRAMA_URL.trim() : '';

  if (hayPrograma) {
    try {
      document.getElementById('ver').href = destino;
      document.getElementById('contenido').classList.add('activo');
    } catch (e) {}
  }

  // Redirección: una sola vez, pase lo que pase con los contadores.
  var yaSeFue = false;
  function irAlPrograma() {
    if (yaSeFue || !hayPrograma) return;
    yaSeFue = true;
    try { window.location.replace(destino); } catch (e) { window.location.href = destino; }
  }

  // 1) Google Analytics. gtag.js carga asíncrono: el evento queda en cola y sale cuando
  //    carga. La redirección espera la confirmación de GA y 600 ms más; si GA no responde
  //    (bloqueador de anuncios, red lenta), un tope de 2,5 s redirige igual.
  var registrada = false;
  function visitaRegistrada() {
    if (registrada) return;
    registrada = true;
    if (hayPrograma) setTimeout(irAlPrograma, 600);
  }
  try {
    gtag('event', 'qr_scan', {
      origen: origen,
      event_callback: visitaRegistrada,
      event_timeout: 1900,
    });
  } catch (e) {
    visitaRegistrada();
  }
  if (hayPrograma) setTimeout(irAlPrograma, 2500);

  // 2) Planilla de escaneos. Sin bloquear nada y sin que un error importe.
  if (CONTADOR_URL) {
    try {
      fetch(CONTADOR_URL + '?origen=' + encodeURIComponent(origen) + '&ua=' + encodeURIComponent(navigator.userAgent),
        { mode: 'no-cors', keepalive: true }).catch(function () {});
    } catch (e) {}
  }
})();
</script>
</body>
</html>
